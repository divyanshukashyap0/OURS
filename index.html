<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OURS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="OURS - Premium developer resources, courses, and projects. Build. Ship. Scale." />

  <title>OURS - Learn. Build. Grow.</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Preload Critical Logo -->
  <link rel="preload" as="image" href="/logo.png">

  <!-- Premium Font - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Prevent iOS zoom on input focus & Force Dark BG -->
  <style>
    @supports (-webkit-touch-callout: none) {

      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    body {
      background-color: #0A0A0A;
      color: #F5F5F5;
    }
  </style>
</head>

<body class="bg-mono-950 text-mono-100 transition-colors duration-400 antialiased overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
